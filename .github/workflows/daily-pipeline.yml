
name: Vantage Intelligence Radar

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Executar Vantage Radar
        env:
          MODO_AUTOMATICO: "false"
        run: python caca_lancamentos_tech.py

      - name: Disponibilizar relatorios para download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vantage-radar-reports
          path: |
            reports/radar.json
            reports/radar.md
          if-no-files-found: error
          retention-days: 30
