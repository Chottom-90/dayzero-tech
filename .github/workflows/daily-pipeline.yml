name: Daily Content Pipeline

on:
  schedule:
    # 12:00 UTC = 09:00 no horário de Brasília (ajuste se quiser outro horário)
    - cron: '0 12 * * *'
  workflow_dispatch: {}  # permite rodar manualmente pelo botão "Run workflow" também

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o pipeline de agentes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODO_AUTOMATICO: "true"
        run: python caca_lancamentos_tech.py

      - name: Publicar mudanças (se houver artigo novo)
        run: |
          git config user.name "dayzero-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs publicados.json
          git diff --staged --quiet || git commit -m "Auto: novo(s) artigo(s) publicado(s) [skip ci]"
          git push
